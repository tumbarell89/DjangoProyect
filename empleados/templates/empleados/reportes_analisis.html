{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4">
    <h1 class="text-3xl font-bold mb-6">Reportes y Análisis</h1>
    
    <form id="busquedaForm" class="mb-8">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label for="fecha_inicial" class="block text-sm font-medium text-gray-700">Fecha Inicial</label>
                <input type="date" id="fecha_inicial" name="fecha_inicial" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
            </div>
            <div>
                <label for="fecha_final" class="block text-sm font-medium text-gray-700">Fecha Final</label>
                <input type="date" id="fecha_final" name="fecha_final" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
            </div>
        </div>
        <div class="mb-4">
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Buscar Evaluaciones
            </button>
        </div>
    </form>

    <div id="evaluacionesContainer" class="mb-8 hidden">
        <h2 class="text-2xl font-bold mb-4">Evaluaciones Encontradas</h2>
        <form id="seleccionForm">
            {% csrf_token %}
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">Seleccionar</th>
                        <th class="py-3 px-6 text-left">Fecha</th>
                        <th class="py-3 px-6 text-left">Período</th>
                    </tr>
                </thead>
                <tbody id="evaluacionesList">
                    <!-- Las evaluaciones se insertarán aquí dinámicamente -->
                </tbody>
            </table>
            <div class="mt-4">
                <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                    Generar Reportes
                </button>
            </div>
        </form>
    </div>

    <div id="graficasContainer" class="hidden">
        <h2 class="text-2xl font-bold mb-4">Gráficas de Análisis</h2>
        <div class="mb-4">
            <button id="exportarExcel" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                Exportar a Excel
            </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <h3 class="text-xl font-bold mb-2">Empleados por Puntuación</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div>
                <h3 class="text-xl font-bold mb-2">Evaluaciones por Criterio</h3>
                <div id="pieChartsContainer"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const busquedaForm = document.getElementById('busquedaForm');
    const seleccionForm = document.getElementById('seleccionForm');
    const evaluacionesContainer = document.getElementById('evaluacionesContainer');
    const evaluacionesList = document.getElementById('evaluacionesList');
    const graficasContainer = document.getElementById('graficasContainer');

    busquedaForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(busquedaForm);
        
        fetch('{% url "reportes_analisis" %}', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': formData.get('csrfmiddlewaretoken')
            }
        })
        .then(response => response.json())
        .then(data => {
            evaluacionesList.innerHTML = '';
            if (data.evaluaciones && data.evaluaciones.length > 0) {
                data.evaluaciones.forEach(evaluacion => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-3 px-6 text-left">
                            <input type="checkbox" name="evaluaciones" value="${evaluacion.id}" class="form-checkbox h-5 w-5 text-blue-600">
                        </td>
                        <td class="py-3 px-6 text-left">${evaluacion.fecha}</td>
                        <td class="py-3 px-6 text-left">${evaluacion.mes_inicial} - ${evaluacion.mes_final}</td>
                    `;
                    evaluacionesList.appendChild(tr);
                });
                evaluacionesContainer.classList.remove('hidden');
                graficasContainer.classList.add('hidden');
            } else {
                evaluacionesContainer.classList.add('hidden');
                alert('No se encontraron evaluaciones en el rango de fechas seleccionado.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ocurrió un error al buscar las evaluaciones. Por favor, intente nuevamente.');
        });
    });

    seleccionForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(seleccionForm);
        formData.append('fecha_inicial', document.getElementById('fecha_inicial').value);
        formData.append('fecha_final', document.getElementById('fecha_final').value);
        
        fetch('{% url "reportes_analisis" %}', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.bar_chart && data.pie_charts) {
                graficasContainer.classList.remove('hidden');
                generarGraficas(data.bar_chart, data.pie_charts);
            } else {
                graficasContainer.classList.add('hidden');
                alert('No se encontraron datos para generar las gráficas.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ocurrió un error al generar los reportes. Por favor, intente nuevamente.');
        });
    });

    function generarGraficas(barChartData, pieChartsData) {
        // Gráfica de Barras
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: barChartData.labels,
                datasets: [{
                    label: 'Cantidad de Empleados',
                    data: barChartData.data,
                    backgroundColor: 'rgba(75, 192, 192, 0.6)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Cantidad de Empleados'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Puntuación'
                        }
                    }
                }
            }
        });

        // Gráficas de Pastel
        const pieChartsContainer = document.getElementById('pieChartsContainer');
        pieChartsContainer.innerHTML = ''; // Limpiar gráficas anteriores

        Object.entries(pieChartsData).forEach(([criterio, data], index) => {
            const canvas = document.createElement('canvas');
            canvas.id = `pieChart${index}`;
            pieChartsContainer.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: data.labels,
                    datasets: [{
                        data: data.data,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)',
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(153, 102, 255, 0.6)'
                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: criterio
                        }
                    }
                }
            });
        });
    }

    document.getElementById('exportarExcel').addEventListener('click', function() {
        const formData = new FormData(seleccionForm);
        formData.append('fecha_inicial', document.getElementById('fecha_inicial').value);
        formData.append('fecha_final', document.getElementById('fecha_final').value);
        formData.append('export', 'true');
        
        fetch('{% url "reportes_analisis" %}', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        })
        .then(response => response.blob())
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'reportes_analisis.xlsx';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ocurrió un error al exportar a Excel. Por favor, intente nuevamente.');
        });
    });
});
</script>
{% endblock %}
