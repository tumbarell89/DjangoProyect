<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Sistema de Gestión de Empleados</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <!-- jQuery (necesario para Select2) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Select2 CSS y JS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <!-- CSS personalizado para Select2 -->
    <style>
        /* Estilos para Select2 */
        .select2-container {
            width: 100% !important;
        }
        
        .select2-container--default .select2-selection--multiple {
            border-color: #d1d5db;
            border-radius: 0.375rem;
            min-height: 38px;
        }
        
        .select2-container--default.select2-container--focus .select2-selection--multiple {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.5);
        }
        
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: #4e73df;
            border: 1px solid #ddd;
            border-radius: 4px;
            color: white;
            padding: 0;
            margin-right: 5px;
            margin-top: 5px;
        }
        
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            color: white;
            margin-right: 0;
        }
        
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
            color: #f8f9fc;
            background: none;
        }
        
        /* Estilo específico para el texto del elemento seleccionado */
        .select2-container--default .select2-selection--multiple .select2-selection__choice__display {
            cursor: default;
            padding-left: 15px;
            padding-right: 5px;
        }
        
        .select2-dropdown {
            border-color: #d1d5db;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #3b82f6;
            color: white;
        }
        
        /* Asegurar que el dropdown aparezca debajo del select */
        .select2-container--open .select2-dropdown--below {
            margin-top: 2px;
        }
        
        /* Ajustar z-index para que el dropdown aparezca por encima de otros elementos */
        .select2-container--open {
            z-index: 9999;
        }
        
        /* Asegurar que el dropdown tenga el mismo ancho que el select */
        .select2-container--default .select2-results > .select2-results__options {
            max-height: 200px;
            overflow-y: auto;
        }
        
        /* Estilos para django-tables2 */
        .table {
            width: 100%;
            margin-bottom: 1rem;
            color: #212529;
            border-collapse: collapse;
        }
        
        .table th,
        .table td {
            padding: 0.75rem;
            vertical-align: top;
            border-top: 1px solid #dee2e6;
        }
        
        .table thead th {
            vertical-align: bottom;
            border-bottom: 2px solid #dee2e6;
            background-color: #f8f9fa;
        }
        
        .table tbody + tbody {
            border-top: 2px solid #dee2e6;
        }
        
        .table-sm th,
        .table-sm td {
            padding: 0.3rem;
        }
        
        .table-bordered {
            border: 1px solid #dee2e6;
        }
        
        .table-bordered th,
        .table-bordered td {
            border: 1px solid #dee2e6;
        }
        
        .table-bordered thead th,
        .table-bordered thead td {
            border-bottom-width: 2px;
        }
        
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, 0.05);
        }
        
        .table-hover tbody tr:hover {
            color: #212529;
            background-color: rgba(0, 0, 0, 0.075);
        }
        
        /* Estilos para paginación */
        .pagination {
            display: flex;
            padding-left: 0;
            list-style: none;
            border-radius: 0.25rem;
            justify-content: center;
            margin-top: 1rem;
        }
        
        .page-link {
            position: relative;
            display: block;
            padding: 0.5rem 0.75rem;
            margin-left: -1px;
            line-height: 1.25;
            color: #3b82f6;
            background-color: #fff;
            border: 1px solid #dee2e6;
        }
        
        .page-link:hover {
            z-index: 2;
            color: #1e40af;
            text-decoration: none;
            background-color: #e9ecef;
            border-color: #dee2e6;
        }
        
        .page-item.active .page-link {
            z-index: 3;
            color: #fff;
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        
        .page-item.disabled .page-link {
            color: #6c757d;
            pointer-events: none;
            cursor: auto;
            background-color: #fff;
            border-color: #dee2e6;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen">

    {% if user.is_authenticated %}
        <div class="flex h-full">
            <!-- Sidebar -->
            <div class="w-64 bg-gray-800 text-white p-4 fixed h-full">
                {% include 'sidebar.html' %}
            </div>

            <!-- Contenido -->
            <div class="ml-64 flex-1 p-10">
                <h1 class="text-2xl font-bold text-blue-900 pb-10">Sistema de Gestión De Evaluación de Trabajadores</h1>
                {% block content %}{% endblock %}
            </div>
        </div>
    {% else %}
        <!-- Aquí el contenido para no autenticados si es necesario -->
        <div class="flex justify-center items-center h-screen">
            {% block login %}{% endblock %}
        </div>
    {% endif %}
    
    <!-- Script para inicializar DataTables en todas las tablas -->
    
</body>
</html>
